<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Transformer pour la planète — Conférence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#f2f2f2;
    font-family:'Poppins',Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:20px;
  }
  .card{
    position:relative;
    width:1080px;
    height:1080px;
    border-radius:28px;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(160deg, #eef7f0 0%, #e3f2ee 35%, #dcedf1 65%, #e8f3ec 100%);
  }

  /* decorative ribbons — softened, pastel version of the original wave */
  .ribbon{position:absolute;pointer-events:none;}
  .ribbon svg{display:block;}
  .ribbon-top{top:-40px;left:-60px;width:520px;}
  .ribbon-bottom{bottom:-40px;right:-80px;width:640px;transform:scaleX(-1);}

  .content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:70px 90px 60px;
  }

  .logo{margin-bottom:18px;}

  h1.line1{
    font-size:64px;
    font-weight:800;
    letter-spacing:2px;
    color:#1f3d3a;
    line-height:1.05;
  }
  h1.line2{
    font-size:58px;
    font-weight:800;
    letter-spacing:1px;
    line-height:1.1;
    margin-bottom:10px;
    background:linear-gradient(90deg,#3f9e5f 0%, #1f9fae 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .conference{
    font-size:26px;
    font-weight:700;
    letter-spacing:10px;
    color:#e0862c;
    margin-bottom:14px;
  }
  .rule{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    color:#3f9e5f;
    margin-bottom:28px;
  }
  .rule .line{width:150px;height:1px;background:#c8ded0;}

  .desc{
    font-size:24px;
    line-height:1.55;
    color:#33403c;
    max-width:820px;
    margin-bottom:0;
  }
  .desc b.green{color:#2f8f52;font-weight:700;}
  .desc b.teal{color:#1f9fae;font-weight:700;}
  .desc b.orange{color:#e0862c;font-weight:700;}

  .pills{display:flex;flex-direction:column;gap:20px;width:100%;max-width:620px;}
  .pill{
    display:flex;
    align-items:center;
    gap:20px;
    background:rgba(255,255,255,0.7);
    border:2px solid var(--pill-color);
    border-radius:40px;
    padding:14px 30px;
    box-shadow:0 4px 14px rgba(31,61,58,0.06);
  }
  .pill .icon{
    width:52px;height:52px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--pill-color);
    color:#fff;flex-shrink:0;
  }
  .pill .icon svg{width:26px;height:26px;fill:#fff;}
  .pill span{font-size:24px;font-weight:700;color:#1f3d3a;}

  .pill.orange{--pill-color:#e0862c;}
  .pill.teal{--pill-color:#1f9fae;}
  .pill.green{--pill-color:#3f9e5f;}
</style>
</head>
<body>

<div class="card">

  <div class="ribbon ribbon-top">
    <svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M-50,120 C80,40 180,180 320,90 C420,30 480,60 560,10" stroke="#e0862c" stroke-width="14" fill="none" opacity="0.35"/>
      <path d="M-50,160 C90,80 190,220 330,130 C430,70 490,100 570,50" stroke="#1f9fae" stroke-width="14" fill="none" opacity="0.35"/>
      <path d="M-50,200 C100,120 200,260 340,170 C440,110 500,140 580,90" stroke="#3f9e5f" stroke-width="14" fill="none" opacity="0.3"/>
    </svg>
  </div>

  <div class="ribbon ribbon-bottom">
    <svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M-50,120 C100,40 220,180 360,90 C470,30 540,60 630,10" stroke="#e0862c" stroke-width="16" fill="none" opacity="0.3"/>
      <path d="M-50,170 C110,90 230,230 370,140 C480,80 550,110 640,60" stroke="#1f9fae" stroke-width="16" fill="none" opacity="0.3"/>
      <path d="M-50,220 C120,140 240,280 380,190 C490,130 560,160 650,110" stroke="#3f9e5f" stroke-width="16" fill="none" opacity="0.25"/>
    </svg>
  </div>

  <div class="content">

    <div class="logo">
      <svg width="140" height="150" viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">
        <path d="M70 10 C95 45 118 65 118 92 C118 118 96 138 70 138 C44 138 22 118 22 92 C22 65 45 45 70 10 Z"
              fill="none" stroke="#2f8f52" stroke-width="4" opacity="0.9"/>
        <path d="M70 38 C86 60 100 74 100 92 C100 109 87 122 70 122 C53 122 40 109 40 92 C40 74 54 60 70 38 Z"
              fill="none" stroke="#1f9fae" stroke-width="4" opacity="0.9"/>
        <circle cx="70" cy="100" r="14" fill="#e0862c"/>
        <path d="M46 118 Q70 128 94 118" fill="none" stroke="#3f9e5f" stroke-width="4" stroke-linecap="round"/>
        <path d="M38 128 Q70 142 102 128" fill="none" stroke="#3f9e5f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      </svg>
    </div>

    <h1 class="line1">TRANSFORMER</h1>
    <h1 class="line2">POUR LA PLANÈTE</h1>
    <div class="conference">C O N F E R E N C E</div>

    <div class="rule">
      <div class="line"></div>
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2 C16 8 20 10 20 14 C20 18.4 16.4 22 12 22 C7.6 22 4 18.4 4 14 C4 10 8 8 12 2 Z" fill="#3f9e5f"/></svg>
      <div class="line"></div>
    </div>

    <p class="desc">
      Une conférence pour comprendre les enjeux
      <b class="teal">environnementaux</b> actuels, découvrir des
      <b class="green">solutions concrètes</b> contre la pollution plastique
      et voir comment chacun peut agir et en faire
      une <b class="orange">opportunité</b> pour demain.
    </p>

  </div>
</div>

</body>
</html>
